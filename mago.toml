php-version = "8.2"

[source]
paths = ["src"]

[formatter]
print-width = 120
use-tabs = false
tab-width = 4
end-of-line = "lf"
single-quote = true
trailing-comma = true

[linter]

[linter.rules.excessive-parameter-list]
# Constructor threshold is raised for DTOs that group API parameters.
constructor-threshold = 10
